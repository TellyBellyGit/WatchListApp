<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading the Tape — A Volume Price Analysis Primer</title>
<style>
  :root{
    --paper: #171B22;
    --paper-raised: #1E232C;
    --paper-raised-2: #242A34;
    --ink: #EDEAE1;
    --ink-dim: #9AA1AC;
    --rule: #2C323C;
    --demand: #C9A227;
    --supply: #B5502F;
    --accent: #4C8C82;
    --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
    line-height:1.55;
    display:flex;
    min-height:100vh;
  }
  a{color:var(--accent);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--rule);
    padding:28px 0;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-title{
    font-family:var(--font-serif);
    font-size:1.05rem;
    color:var(--ink);
    padding:0 22px 6px;
    margin:0;
  }
  .sidebar-sub{
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--ink-dim);
    padding:0 22px 20px;
    letter-spacing:0.02em;
  }
  .nav-item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:var(--font-sans);
    font-size:0.92rem;
    padding:10px 22px;
    cursor:pointer;
    border-left:3px solid transparent;
    line-height:1.35;
  }
  .nav-item:hover{ color:var(--ink); background:var(--paper-raised-2); }
  .nav-item.active{
    color:var(--ink);
    border-left:3px solid var(--demand);
    background:var(--paper-raised-2);
  }
  .nav-num{
    font-family:var(--font-mono);
    color:var(--ink-dim);
    font-size:0.78rem;
    margin-right:8px;
  }
  .nav-item.active .nav-num{ color:var(--demand); }

  /* ---------- Main ---------- */
  main{ flex:1; min-width:0; padding:44px 40px 100px; }
  .content-wrap{ max-width:720px; margin:0 auto; }

  .progress-line{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  h1.lesson-title{
    font-family:var(--font-serif);
    font-size:2rem;
    margin:0 0 22px;
    color:var(--ink);
    border-bottom:1px solid var(--rule);
    padding-bottom:18px;
  }
  h2{
    font-family:var(--font-serif);
    font-size:1.3rem;
    margin:34px 0 12px;
    color:var(--ink);
  }
  h3{
    font-family:var(--font-serif);
    font-size:1.08rem;
    margin:22px 0 10px;
    color:var(--ink);
  }
  p{ margin:0 0 14px; color:var(--ink); max-width:66ch;}
  .dim{ color:var(--ink-dim); }
  .callout{
    background:var(--paper-raised);
    border-left:3px solid var(--accent);
    padding:14px 18px;
    margin:20px 0;
    font-family:var(--font-serif);
    font-size:1.04rem;
    font-style:italic;
  }
  .principle{
    font-family:var(--font-serif);
    font-size:1.15rem;
    font-style: italic;
    color: var(--ink);
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    padding:16px 0;
    margin:26px 0;
  }

  /* ---------- Candle cards ---------- */
  .ccard-row{
    display:flex; flex-wrap:wrap; gap:16px; margin:20px 0 10px;
  }
  .ccard{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:14px;
    width:150px;
    flex-shrink:0;
    text-align:center;
    position:relative;
  }
  .ccard-highlight{ border-color:var(--demand); box-shadow:0 0 0 1px var(--demand) inset; }
  .ccard-tag{
    position:absolute; top:8px; right:8px;
    font-family:var(--font-mono); font-size:0.62rem;
    color:var(--paper); background:var(--demand);
    padding:2px 6px; border-radius:2px;
  }
  .ccard-visual{ display:flex; flex-direction:column; align-items:center; }
  .ccard-label{ font-size:0.85rem; margin-top:8px; color:var(--ink); font-weight:600;}
  .ccard-caption{ font-size:0.78rem; color:var(--ink-dim); margin-top:4px; }
  .ccard-toggle{
    margin-top:10px; background:none; border:1px solid var(--rule); color:var(--accent);
    font-family:var(--font-mono); font-size:0.7rem; padding:4px 8px; border-radius:3px; cursor:pointer;
  }
  .ccard-toggle:hover{ border-color:var(--accent); }
  .ccard-detail{
    display:none; text-align:left; font-size:0.8rem; color:var(--ink-dim);
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--rule);
  }
  .ccard-detail.open{ display:block; }

  /* ---------- Sequence charts ---------- */
  .chart-panel{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:18px 20px 10px;
    margin:18px 0;
    overflow-x:auto;
  }
  .chart-panel svg{ display:block; }
  .reading-list{ margin:14px 0 24px; padding-left:0; list-style:none; }
  .reading-list li{
    display:flex; gap:12px; margin-bottom:10px; align-items:flex-start;
    font-size:0.94rem;
  }
  .reading-num{
    font-family:var(--font-mono); color:var(--paper); background:var(--ink-dim);
    width:22px; height:22px; min-width:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:0.72rem; margin-top:2px;
  }

  .scenario-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:18px 0; }
  .scenario-grid .chart-panel{ margin:0; padding:12px 12px 6px; }
  .scenario-cap{ font-size:0.82rem; color:var(--ink-dim); margin-top:8px; }
  @media (max-width:900px){ .scenario-grid{ grid-template-columns:1fr; } }

  .grid2x2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:20px 0; }
  @media (max-width:560px){ .grid2x2{ grid-template-columns:1fr; } }
  .cell{
    background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px;
    padding:16px; cursor:pointer;
  }
  .cell.anomaly{ border-color:var(--demand); }
  .cell-head{ font-weight:600; font-size:0.9rem; margin-bottom:8px; }
  .cell-body{ display:flex; align-items:center; gap:14px; }
  .cell-text{ font-size:0.82rem; color:var(--ink-dim); }
  .cell-detail{ display:none; margin-top:10px; font-size:0.82rem; border-top:1px dashed var(--rule); padding-top:10px; }
  .cell-detail.open{ display:block; }

  .qa{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:16px 18px; margin:14px 0; }
  .qa-q{ font-weight:600; cursor:pointer; }
  .qa-a{ display:none; margin-top:10px; color:var(--ink-dim); font-size:0.92rem; }
  .qa-a.open{ display:block; }

  .nav-buttons{
    display:flex; justify-content:space-between; margin-top:46px; padding-top:20px; border-top:1px solid var(--rule);
  }
  .nav-btn{
    font-family:var(--font-mono); font-size:0.8rem; background:none; color:var(--ink);
    border:1px solid var(--rule); padding:10px 16px; border-radius:3px; cursor:pointer;
  }
  .nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .nav-btn:disabled{ opacity:0.3; cursor:default; }

  .legend{ display:flex; gap:18px; font-size:0.78rem; color:var(--ink-dim); margin:6px 0 18px; font-family:var(--font-mono); }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .swatch{ width:10px; height:10px; display:inline-block; border-radius:2px; }

  @media (max-width:820px){
    body{ flex-direction:column; }
    .sidebar{ position:relative; width:100%; height:auto; display:flex; overflow-x:auto; padding:14px 0; border-right:none; border-bottom:1px solid var(--rule); }
    .sidebar-title,.sidebar-sub{ display:none; }
    .nav-item{ white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:8px 14px; }
    .nav-item.active{ border-left:none; border-bottom:3px solid var(--demand); }
    main{ padding:28px 18px 80px; }
  }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <p class="sidebar-title">Reading the Tape</p>
  <p class="sidebar-sub">A Volume Price Analysis primer</p>
  <div id="nav-items"></div>
</nav>

<main>
  <div class="content-wrap" id="content-wrap"></div>
</main>

<script>
/* ============ candle / chart drawing helpers ============ */

function svgCandle(o,c,h,l,opts={}){
  const w=opts.w||60, ht=opts.ht||140, pad=8;
  const range=(h-l)||1;
  const scaleY = v => pad + (h-v)/range*(ht-2*pad);
  const isUp = c>=o;
  const color = isUp ? 'var(--demand)' : 'var(--supply)';
  const bodyTop = scaleY(Math.max(o,c)), bodyBot = scaleY(Math.min(o,c));
  const bodyHeight = Math.max(bodyBot-bodyTop, 2);
  const cx=w/2, bw=w*0.42;
  return `<svg viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}">
    <line x1="${cx}" y1="${scaleY(h)}" x2="${cx}" y2="${scaleY(l)}" stroke="${color}" stroke-width="2"/>
    <rect x="${cx-bw/2}" y="${bodyTop}" width="${bw}" height="${bodyHeight}" fill="${color}"/>
  </svg>`;
}

function svgVolBar(v,maxV,opts={}){
  const w=opts.w||60, ht=opts.ht||42;
  const color = opts.color || 'var(--ink-dim)';
  const bh = Math.max((v/maxV)*ht, 3);
  return `<svg viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}">
    <rect x="${w*0.22}" y="${ht-bh}" width="${w*0.56}" height="${bh}" fill="${color}" opacity="0.9"/>
  </svg>`;
}

function candleCard({o,c,h,l,v,maxV=100,label,caption,tag,highlight,detail,id}){
  return `<div class="ccard ${highlight?'ccard-highlight':''}">
    ${tag?`<div class="ccard-tag">${tag}</div>`:''}
    <div class="ccard-visual">
      ${svgCandle(o,c,h,l)}
      ${v!=null?svgVolBar(v,maxV,{color:c>=o?'var(--demand)':'var(--supply)'}):''}
    </div>
    <div class="ccard-label">${label}</div>
    ${caption?`<div class="ccard-caption">${caption}</div>`:''}
    ${detail?`<button class="ccard-toggle" onclick="toggleClass('detail-${id}')">Read more</button>
    <div class="ccard-detail" id="detail-${id}">${detail}</div>`:''}
  </div>`;
}

function sequenceChart(candles, opts={}){
  const width = opts.width || 620;
  const priceH = opts.priceHeight || 140;
  const volH = opts.volHeight || 46;
  const gapH = 12;
  const leftPad = 4;
  const bottomLabelH = 18;
  const totalH = priceH+gapH+volH+bottomLabelH;
  const n = candles.length;
  const plotWidth = width - leftPad*2;
  const colW = plotWidth/n;

  const refLines = opts.refLines || [];
  const highs = candles.map(c=>c.h);
  const lows = candles.map(c=>c.l);
  const refVals = refLines.map(r=>r.value);
  let maxP = Math.max(...highs, ...refVals);
  let minP = Math.min(...lows, ...refVals);
  const pad = (maxP-minP)*0.12 || 1;
  maxP += pad; minP -= pad;
  const priceScale = v => priceH - ((v-minP)/(maxP-minP))*priceH;
  const maxVol = Math.max(...candles.map(c=>c.v));

  let parts = [];

  refLines.forEach(r=>{
    const y = priceScale(r.value);
    parts.push(`<line x1="0" y1="${y}" x2="${plotWidth}" y2="${y}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" opacity="0.75"/>`);
    parts.push(`<text x="4" y="${y-4}" fill="var(--accent)" font-size="10" font-family="var(--font-mono)">${r.label}</text>`);
  });

  candles.forEach((c,i)=>{
    const cx = i*colW + colW/2;
    const bw = colW*0.42;
    const isUp = c.c >= c.o;
    const color = isUp ? 'var(--demand)' : 'var(--supply)';
    const yH=priceScale(c.h), yL=priceScale(c.l), yO=priceScale(c.o), yC=priceScale(c.c);
    const bodyTop = Math.min(yO,yC), bodyBot = Math.max(yO,yC);
    const bodyHeight = Math.max(bodyBot-bodyTop, 1.5);
    parts.push(`<line x1="${cx}" y1="${yH}" x2="${cx}" y2="${yL}" stroke="${color}" stroke-width="1.6"/>`);
    parts.push(`<rect x="${cx-bw/2}" y="${bodyTop}" width="${bw}" height="${bodyHeight}" fill="${color}"/>`);
    const vh = (c.v/maxVol)*volH;
    const vy = priceH+gapH+(volH-vh);
    parts.push(`<rect x="${cx-bw/2}" y="${vy}" width="${bw}" height="${vh}" fill="${color}" opacity="0.85"/>`);
    parts.push(`<text x="${cx}" y="${priceH+gapH+volH+13}" fill="var(--ink-dim)" font-size="10" text-anchor="middle" font-family="var(--font-mono)">${i+1}</text>`);
  });

  return `<div class="chart-panel"><svg viewBox="0 0 ${width} ${totalH}" width="100%" style="max-width:${width}px">
    <g transform="translate(${leftPad},0)">${parts.join('')}</g>
  </svg></div>`;
}

function readingList(items){
  return `<ol class="reading-list">${items.map((t,i)=>`<li><span class="reading-num">${i+1}</span><span>${t}</span></li>`).join('')}</ol>`;
}

function toggleClass(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');
}

function legend(){
  return `<div class="legend">
    <span><span class="swatch" style="background:var(--demand)"></span>Up candle / rising volume bar</span>
    <span><span class="swatch" style="background:var(--supply)"></span>Down candle / falling volume bar</span>
  </div>`;
}

/* ============ lesson content ============ */

const LESSONS = [
{
  title: "The core idea",
  render: () => `
    <p>Every lesson in this primer comes back to one sentence. Get this sentence right and the rest of Volume Price Analysis (VPA) is just detail.</p>
    <div class="principle">Price tells you the result of the market's activity. Volume tells you the effort behind that result.</div>
    <p>Think of a bar on your chart as a small experiment. The candle's body and wicks show you what happened to price — the <em>result</em>. The volume bar underneath shows you how much buying and selling activity it took to produce that result — the <em>effort</em>.</p>
    <p>Most beginners skip straight to "high volume is bullish, low volume is bearish." That shortcut breaks constantly, because volume has no fixed direction of its own — it only tells you how much effort was spent. Whether that effort was spent by buyers or sellers, and whether it succeeded, is written in the price bar next to it.</p>
    <h2>The one question VPA keeps asking</h2>
    <p>Instead of labelling volume "bullish" or "bearish," train yourself to ask a single question of every bar:</p>
    <div class="callout">Does the price result make sense given the amount of effort behind it?</div>
    <p>When effort and result agree — a lot of volume producing a big price move, or a little volume producing barely any movement — the bar is telling you a straightforward story. When they disagree, that's where VPA gets interesting, and that disagreement is what the rest of this course is built around.</p>
    <p class="dim">Lesson 2 starts with the smallest unit of that story: a single candle, before volume even enters the picture.</p>
  `
},
{
  title: "Reading a single candle",
  render: () => `
    <p>Before you bring volume into it, a candle already tells you two things on its own: how far price travelled, and where it finally settled. Both matter to VPA on their own.</p>
    <h2>Spread — how far did price travel?</h2>
    <p><strong>Spread</strong> is just the candle's total range, high to low. A wide spread means a lot of ground was covered. A narrow spread means price barely moved, regardless of how much time or effort went into the attempt.</p>
    <h2>Close position — who won control into the close?</h2>
    <p>Where the candle finally closes, relative to its own high and low, tells you who was in control by the end of the bar. A close near the high suggests buyers held the advantage through to the end. A close near the low suggests sellers did. A close in the middle suggests neither side clearly won.</p>
    <div class="ccard-row">
      ${candleCard({o:100,c:110,h:111,l:99, label:"Wide spread, close near high", caption:"Buyers pushed and held the advantage all the way to the close."})}
      ${candleCard({o:110,c:100,h:111,l:99, label:"Wide spread, close near low", caption:"Sellers pushed and kept control into the close."})}
      ${candleCard({o:104,c:106,h:107,l:103, label:"Narrow spread, close mid", caption:"Very little ground covered either way — a quiet bar."})}
      ${candleCard({o:103,c:104,h:110,l:97, label:"Wide spread, close mid", caption:"A lot of back-and-forth, but neither side kept the advantage."})}
    </div>
    <p>Notice that none of these four bars have a volume figure attached yet — and you can already say something meaningful about each one. That's the point: spread and close position are half the picture. Volume is what tells you whether the story they suggest is actually credible.</p>
  `
},
{
  title: "Adding volume: the four combinations",
  render: () => `
    <p>Now bring volume in. Pair candle direction with whether volume was rising or falling compared to recent bars, and you get four basic combinations. Treat these as a first-level classification, not a rulebook — lesson 5 will complicate all four of them with location, and that's a feature, not a flaw.</p>
    ${legend()}
    <div class="ccard-row">
      ${candleCard({o:100,c:108,h:109,l:99,v:90,maxV:100, label:"Up + volume up", caption:"Buyers showing rising participation, and price is responding. The straightforward bullish case."})}
      ${candleCard({o:100,c:107,h:108,l:99,v:25,maxV:100, label:"Up + volume down", caption:"Price rises, but fewer people are involved. Could be fading demand, or just an easy path with no sellers in the way."})}
      ${candleCard({o:108,c:100,h:109,l:99,v:95,maxV:100, label:"Down + volume up", caption:"Usually rising selling pressure — but watch for the exception in lesson 6: a selling climax looks like this too."})}
      ${candleCard({o:107,c:101,h:108,l:100,v:20,maxV:100, label:"Down + volume down", caption:"Often weak selling pressure. In an uptrend, this is frequently just a shallow, low-conviction pullback."})}
    </div>
    <p>The "down + volume down" case is worth sitting with, because it's the one that most contradicts beginner instinct. A falling price on falling volume doesn't automatically mean weakness — it can mean sellers are running out of interest, which is exactly the read you've already been applying to your own pullback entries.</p>
  `
},
{
  title: "The effort/result anomaly",
  render: () => `
    <p>The four combinations in lesson 3 sort bars by direction. This lesson sorts them a different way — by whether the <em>size</em> of the effort matches the <em>size</em> of the result — and this is the version of VPA that actually does the analytical work.</p>
    <h2>The anomaly grid</h2>
    <p>Ignore direction for a moment and just ask: was the effort (volume) high or low, and was the result (spread) large or small?</p>
    <div class="grid2x2">
      <div class="cell" onclick="toggleClass('cell-1')">
        <div class="cell-head">High effort → large result</div>
        <div class="cell-body">${svgCandle(100,112,113,99,{w:50,ht:90})}<span class="cell-text">Normal. Effort is producing a proportionate result.</span></div>
        <div class="cell-detail" id="cell-1">This is the least interesting cell — it's the market behaving exactly as you'd expect. High volume, wide spread. Nothing anomalous to explain.</div>
      </div>
      <div class="cell" onclick="toggleClass('cell-2')">
        <div class="cell-head">Low effort → small result</div>
        <div class="cell-body">${svgCandle(104,106,107,103,{w:50,ht:90})}<span class="cell-text">Normal. Quiet market, quiet bar.</span></div>
        <div class="cell-detail" id="cell-2">Also unremarkable. Low participation, and price didn't go anywhere — the two facts agree with each other.</div>
      </div>
      <div class="cell anomaly" onclick="toggleClass('cell-3')">
        <div class="cell-head">High effort → small result <span style="color:var(--demand);font-family:var(--font-mono);font-size:0.7rem;">ANOMALY</span></div>
        <div class="cell-body">${svgCandle(104,105,106,103,{w:50,ht:90})}<span class="cell-text">Huge volume, narrow spread. Something absorbed the pressure.</span></div>
        <div class="cell-detail" id="cell-3">This is one of the two cells that actually matters. A large amount of buying or selling occurred, but price barely moved — which means an opposing force absorbed nearly all of it. This is the fingerprint of absorption, and it's usually most meaningful at a support or resistance level (lesson 5).</div>
      </div>
      <div class="cell anomaly" onclick="toggleClass('cell-4')">
        <div class="cell-head">Low effort → large result <span style="color:var(--demand);font-family:var(--font-mono);font-size:0.7rem;">ANOMALY</span></div>
        <div class="cell-body">${svgCandle(100,110,111,99,{w:50,ht:90})}<span class="cell-text">Tiny volume, wide spread. Price moved easily — check why.</span></div>
        <div class="cell-detail" id="cell-4">The other anomaly. Price travelled a long way on very little effort, which usually means it met almost no opposition — for instance, a breakout into an area with no resting supply or demand. It can be a genuine, low-friction move, or a thin, easily-reversed one; you need the next few bars to tell you which.</div>
      </div>
    </div>
    <p class="dim">Click any cell to expand it.</p>
    <div class="principle">"Does the result make sense given the effort?" — not "was there a lot of effort," and not "was the result large." The mismatch is the signal.</div>
  `
},
{
  title: "Location changes everything",
  render: () => `
    <p>Here's the catch that makes VPA genuinely difficult, and genuinely useful: the exact same candle and volume, in isolation, can mean close to opposite things depending on <em>where</em> it happens. Take the high-effort/small-result anomaly from lesson 4 and drop it into three different locations.</p>
    <div class="scenario-grid">
      <div>
        ${sequenceChart([
          {o:100,c:104,h:105,l:99,v:50},
          {o:104,c:108,h:109,l:103,v:55},
          {o:108,c:109,h:112,l:107,v:95}
        ], {width:280, priceHeight:110, volHeight:34, refLines:[{value:112, label:"Resistance"}]})}
        <p class="scenario-cap"><strong>At resistance:</strong> heavy volume produces almost no further progress right into a level that's already stopped price before. Reads as supply absorbing demand — a caution flag, not a breakout.</p>
      </div>
      <div>
        ${sequenceChart([
          {o:100,c:102,h:103,l:99,v:40},
          {o:102,c:101,h:104,l:100,v:35},
          {o:101,c:102,h:105,l:100,v:90}
        ], {width:280, priceHeight:110, volHeight:34})}
        <p class="scenario-cap"><strong>In the middle of a range:</strong> same shape, no nearby level. Far less meaningful — could just be a large order clearing within a range that nobody was defending.</p>
      </div>
      <div>
        ${sequenceChart([
          {o:108,c:104,h:109,l:103,v:50},
          {o:104,c:100,h:105,l:99,v:55},
          {o:99,c:98,h:100,l:97,v:95}
        ], {width:280, priceHeight:110, volHeight:34, refLines:[{value:97, label:"Support"}]})}
        <p class="scenario-cap"><strong>At support, after a decline:</strong> heavy selling volume, but price can't make further downside progress right at a level that's held before. Reads as demand absorbing supply — a bullish tell, not weakness.</p>
      </div>
    </div>
    <p>Same effort/result mismatch, three different conclusions. This is why experienced VPA readers treat location — support, resistance, VWAP, a prior swing high or low — as a required input, not an optional extra. A signal without a location is only half a signal.</p>
    <p class="dim">It's also why a single bar is never conclusive on its own — you always read it against what came immediately before it, which is exactly what these three-candle lead-ins are doing.</p>
  `
},
{
  title: "The named patterns",
  render: () => {
    const p = (cfg) => candleCard(cfg);
    return `
    <p>Once you can read effort-vs-result and factor in location, most of "VPA vocabulary" is just naming specific, recurring versions of that same idea. Here are the six most useful ones to know first.</p>
    <div class="ccard-row">
      ${p({id:"nd", o:104,c:106,h:107,l:103,v:15,maxV:100,label:"No demand",
          caption:"Up bar, narrow spread, low volume, in an uptrend.",
          detail:"Buyers pushed price up, but almost nobody showed up to do it, and it didn't travel far. In a rally, a run of these is an early warning that upside interest is drying out — worth watching, not yet acting on alone."})}
      ${p({id:"ns", o:106,c:104,h:107,l:103,v:15,maxV:100,label:"No supply",
          caption:"Down bar, narrow spread, low volume, during a pullback.",
          detail:"Sellers had the floor, but hardly anyone took it, and price barely gave ground. This is the classic 'healthy pullback' signature — declining volume into a dip is exactly the pattern you already look for at the 9 EMA."})}
      ${p({id:"sv", o:106,c:104,h:109,l:97,v:95,maxV:100,label:"Stopping volume",
          caption:"Wide down bar, exceptional volume, closing well off the low.",
          detail:"A burst of heavy selling meets equally heavy buying, and price is pulled back up off its low before the bar closes. It suggests supply is being absorbed — but it is not yet a reversal signal by itself; it just means the decline met real resistance."})}
      ${p({id:"scl", o:110,c:103,h:111,l:95,v:100,maxV:100,tag:"climax",label:"Selling climax",
          caption:"An extreme version of stopping volume, after a prolonged decline.",
          detail:"Exceptional volume, a very wide down bar, closing meaningfully away from the low — happening at the end of an extended decline. This is often where the last sellers are being absorbed. Critically: you do not buy the climax bar itself. You wait for confirmation (lesson 7)."})}
      ${p({id:"bcl", o:100,c:105,h:112,l:99,v:100,maxV:100,tag:"climax",label:"Buying climax",
          caption:"The mirror image, after an extended advance.",
          detail:"Exceptional volume, a wide up bar, closing away from the high, after a prolonged rally. New buyers are being absorbed by sellers happy to distribute into the excitement. Same rule applies in reverse: this bar is a warning, not a short signal on its own."})}
      ${p({id:"ab", o:104,c:105,h:106,l:103,v:95,maxV:100,label:"Absorption",
          caption:"Narrow spread, exceptional volume, price simply stalls.",
          detail:"The general case behind stopping volume, climaxes, and the lesson-4 anomaly: a large amount of buying or selling is being matched almost bar-for-bar by the opposite side, so price goes nowhere despite the activity. Where this happens (lesson 5) tells you whether it favors buyers or sellers."})}
    </div>
    <p class="dim">Click "Read more" on any card for the fuller explanation.</p>
  `},
},
{
  title: "Wait for confirmation",
  render: () => `
    <p>This is the rule beginners break most often: treating the climax or anomaly bar itself as the entry signal. It isn't. VPA doesn't predict what happens next — it shows you evidence of supply, demand, or an anomaly. You still need the market to confirm that reading before you act on it.</p>
    <div class="callout">High-volume stopping volume, followed by the next candle holding above its low, followed by a subsequent higher high — that sequence is far more convincing than the climax candle on its own.</div>
    <p>Here's a full sequence: a decline, a selling climax, and the two bars that either confirm or fail to confirm it.</p>
    ${sequenceChart([
      {o:112,c:104,h:113,l:103,v:40},
      {o:104,c:96,h:105,l:94,v:60},
      {o:96,c:90,h:97,l:82,v:100},
      {o:90,c:93,h:95,l:89,v:45},
      {o:93,c:99,h:101,l:92,v:55}
    ], {width:620, refLines:[{value:82, label:"Climax low"}]})}
    ${readingList([
      "A normal decline — down bar, moderate volume. Nothing unusual yet.",
      "The decline accelerates — a wider bar and rising volume. Sellers are pressing.",
      "<strong>Selling climax.</strong> Exceptional volume, the widest range so far, but the close recovers well above the low — the first sign supply is being absorbed. This is not yet an entry.",
      "Confirmation, part one: price holds above the climax low on lighter volume. Sellers aren't pushing back through it.",
      "Confirmation, part two: a higher high forms relative to the prior bar, on returning volume. Only now does the climax reading actually get validated."
    ])}
    <p>If bar 4 had broken back below the climax low, the climax reading would have failed, and you'd have learned that cheaply — by waiting, rather than by being in the trade already.</p>
  `
},
{
  title: "A full walkthrough",
  render: () => `
    <p>Now put every layer together on one sequence: price, spread, close, volume, and location, read in order, on a scenario built around exactly the kind of setup you already trade — a 1-minute pullback into a rising short-term average before continuation.</p>
    ${sequenceChart([
      {o:100,c:106,h:107,l:99,v:80},
      {o:106,c:110,h:111,l:105,v:70},
      {o:110,c:108,h:110,l:107,v:35},
      {o:108,c:107,h:108,l:106,v:20},
      {o:107,c:106.5,h:107.2,l:106,v:12},
      {o:106.5,c:108,h:108.5,l:106.3,v:40},
      {o:108,c:113,h:114,l:107.8,v:85}
    ], {width:660, refLines:[{value:110, label:"Micro-pullback high"}]})}
    ${readingList([
      "<strong>Impulse.</strong> Wide up bar, strong volume. Effort and result agree — a genuine, well-supported move.",
      "<strong>Continuation.</strong> Another wide up bar, still on solid volume. The trend is intact and demand is still showing up.",
      "<strong>Pullback begins.</strong> Down bar, but volume drops off sharply compared to bars 1–2. Sellers are active, but with noticeably less conviction than the buyers who drove the impulse.",
      "<strong>Pullback continues, narrowing.</strong> Spread contracts further, volume keeps falling. This is the 'no supply' signature from lesson 6 — sellers are running out of steam, not gaining it. (Picture the rising 9 EMA sitting just under these bars — it isn't drawn here since it moves bar to bar, but this is the zone it would be hugging.)",
      "<strong>Selling stalls.</strong> Tiny spread, the lowest volume in the sequence. Effort and result are both minimal — nobody is pressing the move in either direction.",
      "<strong>Volume returns, price turns up.</strong> The first up bar since the pullback began, and it comes with a real pickup in participation — effort is now showing up on the buy side again.",
      "<strong>Breakout.</strong> Wide up bar, the strongest volume of the whole sequence, clearing the micro-pullback high. Effort and result agree again, and now they agree in the direction the setup was built for."
    ])}
    <p>Notice that the actionable information wasn't in any single bar — it was in the sequence: volume contracting through the pullback (weak effort behind the down move), spread narrowing at the same time (shrinking result to match), and then both effort and result reappearing together, in the right direction, right as price cleared the level that mattered.</p>

    <h2>Check yourself</h2>
    <div class="qa">
      <div class="qa-q" onclick="toggleClass('qa1')">Why is bar 5 more informative than bar 3, even though both are down-ish or flat bars?</div>
      <div class="qa-a" id="qa1">Bar 5 has both the narrowest spread and the lowest volume of the pullback — effort and result have both shrunk to almost nothing. Bar 3 still has meaningful volume behind it, so the pullback hasn't yet shown you that sellers are exhausted; bar 5 is where that evidence is strongest.</div>
    </div>
    <div class="qa">
      <div class="qa-q" onclick="toggleClass('qa2')">Would bar 6 alone have been enough to act on?</div>
      <div class="qa-a" id="qa2">On its own, one up bar with better volume is suggestive but not conclusive — it could just as easily be a one-bar bounce inside a pullback that resumes lower. It only becomes a strong signal in the context of bars 3–5 already showing supply drying up, and bar 7 then confirming with a break of the level.</div>
    </div>
    <div class="qa">
      <div class="qa-q" onclick="toggleClass('qa3')">What would have invalidated this read?</div>
      <div class="qa-a" id="qa3">If volume had picked back up on a down bar during the pullback (bars 3–5), that would mean sellers were regaining conviction, not losing it — the opposite of what "no supply" requires. Or if bar 7 had come on weak volume, the breakout itself would be the kind of low-effort/large-result anomaly from lesson 4 — worth treating with more suspicion, not less.</div>
    </div>
    <p class="dim">That's the full arc: a single principle (effort vs. result), read through spread, close, volume and location, confirmed rather than assumed. Everything else in VPA is a variation on this walkthrough.</p>
  `
}
];

/* ============ app shell ============ */

let activeIndex = 0;

function renderNav(){
  const nav = document.getElementById('nav-items');
  nav.innerHTML = LESSONS.map((l,i)=>`
    <button class="nav-item ${i===activeIndex?'active':''}" onclick="goTo(${i})">
      <span class="nav-num">${String(i+1).padStart(2,'0')}</span>${l.title}
    </button>
  `).join('');
}

function renderContent(){
  const wrap = document.getElementById('content-wrap');
  const lesson = LESSONS[activeIndex];
  wrap.innerHTML = `
    <div class="progress-line">Lesson ${activeIndex+1} of ${LESSONS.length}</div>
    <h1 class="lesson-title">${lesson.title}</h1>
    ${lesson.render()}
    <div class="nav-buttons">
      <button class="nav-btn" onclick="goTo(${activeIndex-1})" ${activeIndex===0?'disabled':''}>&larr; Previous</button>
      <button class="nav-btn" onclick="goTo(${activeIndex+1})" ${activeIndex===LESSONS.length-1?'disabled':''}>Next &rarr;</button>
    </div>
  `;
  window.scrollTo(0,0);
}

function goTo(i){
  if(i<0 || i>=LESSONS.length) return;
  activeIndex = i;
  renderNav();
  renderContent();
}

renderNav();
renderContent();
</script>
